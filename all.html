<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shan Lin | All Works</title>
  
   <!-- Favicon -->
  <link rel="icon" href="res/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="res/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="res/favicon-16x16.png" />

  <link rel="stylesheet" href="main.css" />
</head>

<body class="page-all">

  <header class="site-header">
    <div class="header-inner">
      <div class="site-name">
        <a class="brand" href="index.html">Shan Lin</a>
      </div>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a class="is-active" href="all.html" aria-current="page">All Works</a>
        <a href="about.html">About</a>
        <a href="resume.html">Resume</a>
      </nav>

    </div>
  </header>

  <main class="container all-main">

    <section class="page-head page-head-split">
      <h1>All Works</h1>
      <p class="lede">
        A comprehensive collection of my creative work spanning multiple
        disciplines and years. Each project represents a unique exploration
        of aesthetic principles and design thinking.
      </p>
    </section>

    <section class="filters filters-shell" aria-label="Work filters">
      <div class="tag-row" id="tagRow">
        <button class="tag is-active" data-tag="all">All</button>

        <button class="tag" data-tag="video-game">video-game</button>
        <button class="tag" data-tag="board-game">board-game</button>
        <button class="tag" data-tag="alt-control">alt-control</button>
        <button class="tag" data-tag="installation">installation</button>
        <button class="tag" data-tag="film">film</button>
        <button class="tag" data-tag="3d-modeling">3d-modeling</button>
        <button class="tag" data-tag="mixed-media">mixed-media</button>


      </div>
    </section>

    <section class="filters filters-shell" aria-label="Sort filters">
      <div class="tag-row" id="yearRow">
        <button class="tag is-active" data-year="all">All Years</button>
      </div>
    </section>

    <section class="works works-all">
      <div class="work-grid" id="workGrid"></div>
      <p class="no-results" id="noResults" hidden aria-live="polite">No works match this selection.</p>
    </section>

  </main>

  <script src="works.js"></script>
  <script src="render.js"></script>
  <script>
    renderAll("workGrid");
  </script>
  <script src="all.js"></script>

</body>

</html>
