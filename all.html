<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shan Lin | Portfolio OS</title>
  <script>
    const archive = new URL("desktop.html?app=work", location.href);
    const filters = new URLSearchParams(location.search);
    for (const name of ["tag", "year"]) {
      if (filters.has(name)) archive.searchParams.set(name, filters.get(name));
    }
    location.replace(archive);
  </script>
  <meta http-equiv="refresh" content="0; url=desktop.html?app=work">
</head>
