<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A dreamlike interactive portfolio archive for Shan Lin." />
  <title>Shan Lin | Dream</title>

  <link rel="icon" href="res/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="res/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="res/favicon-16x16.png" />

  <script src="theme.js"></script>

  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="page-dream">
  <div class="dream-noise" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="site-name">
        <a class="brand" href="index.html">Shan Lin</a>
      </div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="all.html">All Works</a>
        <a href="about.html">About</a>
        <a href="resume.html">Resume</a>
        <a class="is-active" href="dream.html" aria-current="page">Dream</a>
      </nav>
    </div>
  </header>

  <main class="dream-main">
    <section class="dream-intro" aria-labelledby="dreamTitle">
      <p class="dream-kicker">Dream Archive</p>
      <h1 id="dreamTitle">Enter the dream archive.</h1>
      <p class="dream-lede">
        One dream drifts here at a time. Disturb it to wake a project.
      </p>
    </section>

    <section class="dream-stage" aria-label="Interactive dream archive of portfolio projects">
      <div class="dream-haze dream-haze-a" aria-hidden="true"></div>
      <div class="dream-haze dream-haze-b" aria-hidden="true"></div>
      <div class="dream-haze dream-haze-c" aria-hidden="true"></div>

      <div class="dream-scene">
        <div class="dream-project-field" id="dreamProjectField"></div>

        <div class="dream-sleeper" aria-hidden="true">
          <div class="sleep-aura"></div>

          <svg class="sleep-sprite" viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <rect x="16" y="102" width="128" height="12" fill="#05070d" />
            <rect x="22" y="94" width="116" height="10" fill="#0c1017" />
            <rect x="28" y="58" width="98" height="36" fill="#231b2f" />
            <rect x="30" y="60" width="94" height="32" fill="#312541" />
            <rect x="36" y="62" width="28" height="16" fill="#cbc7d2" />
            <rect x="40" y="66" width="20" height="8" fill="#f6f2ff" />

            <g class="sleep-body">
              <rect x="62" y="60" width="18" height="16" fill="#efc9c7" />
              <rect x="60" y="58" width="16" height="6" fill="#f089a8" />
              <rect x="58" y="62" width="4" height="10" fill="#f089a8" />
              <rect x="70" y="66" width="4" height="2" fill="#3f2b3d" />
              <rect x="84" y="74" width="10" height="4" fill="#efc9c7" />
            </g>

            <g class="sleep-blanket">
              <rect x="56" y="72" width="56" height="18" fill="#5f79a4" />
              <rect x="58" y="74" width="52" height="14" fill="#6f8bb6" />
              <rect x="62" y="78" width="44" height="4" fill="#99aed3" />
              <rect x="76" y="88" width="20" height="4" fill="#45516f" />
            </g>

            <rect x="112" y="72" width="10" height="16" fill="#362841" />
            <rect x="118" y="82" width="8" height="10" fill="#231b2f" />
            <rect x="24" y="94" width="10" height="28" fill="#0b0f16" />
            <rect x="126" y="94" width="10" height="28" fill="#0b0f16" />
            <rect x="24" y="118" width="112" height="6" fill="#080b11" />
          </svg>

          <span class="sleep-z sleep-z-a">z</span>
          <span class="sleep-z sleep-z-b">z</span>
          <span class="sleep-z sleep-z-c">z</span>
        </div>
      </div>

      <p class="sr-only" id="dreamStatus" aria-live="polite"></p>
    </section>

    <div class="dream-controls">
      <button class="dream-button" id="anotherDreamButton" type="button" aria-controls="dreamProjectField">
        Another Dream
      </button>
      <a class="dream-all-works" href="all.html">All Works</a>
    </div>
  </main>

  <noscript>
    <div class="noscript-banner">
      JavaScript is off. Browse the archive from <a href="all.html">All Works</a>.
    </div>
  </noscript>

  <script src="works.js"></script>
  <script src="script.js"></script>
</body>

</html>
