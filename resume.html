  <main class="container resume-main">

          <p class="resume-group-label">English</p>
          <div class="resume-option-grid">

        <div class="resume-selector-group">
          <p class="resume-group-label">&#20013;&#25991;</p>
          <div class="resume-option-grid">
            <button class="resume-option" type="button" data-resume-key="zh-designer" aria-pressed="false">
              <span class="resume-option-role">&#35774;&#35745;</span>
              <span class="resume-option-meta">&#20013;&#25991;&#29256;</span>
            </button>
            <button class="resume-option" type="button" data-resume-key="zh-producer" aria-pressed="false">
              <span class="resume-option-role">&#21046;&#20316;&#20154;</span>
              <span class="resume-option-meta">&#20013;&#25991;&#29256;</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="detail-section resume-panel" aria-label="Resume preview">
      <div class="resume-status" id="resumeStatus">English / Designer</div>

      <iframe
        class="resume-frame"
        id="resumeFrame"
        src="https://drive.google.com/file/d/1ywteaSgiErVN4RNzRLbX16KqsMTxPs-w/preview"
        title="Resume preview"
        loading="lazy">
      </iframe>

      <p class="resume-fallback" id="resumeFallback">
        If the preview does not load, <a class="detail-link" id="resumeFallbackLink" href="https://drive.google.com/file/d/1ywteaSgiErVN4RNzRLbX16KqsMTxPs-w/view?usp=drive_link" target="_blank" rel="noopener">open the resume PDF</a>.

        <p>&#36825;&#20010;&#29256;&#26412;&#30340; PDF &#36824;&#27809;&#26377;&#25918;&#36827;&#32593;&#31449;&#12290;</p>
