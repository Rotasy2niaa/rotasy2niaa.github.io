          <p>Part of me is made of video games, film, photography, mixed media, and physical computing.</p>
          <p>I work with games and interactive systems, with a particular interest in level design and spatial storytelling. I’m based in Los Angeles and explore how environments, pacing, and subtle interactions shape emotional experience.</p>
